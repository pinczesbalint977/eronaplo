name: Ellenőrzés és GitHub Pages publikálás

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Biztonsági és böngészős ellenőrzés
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Deterministic test base; the actual Pages base is derived in the deploy job.
      VITE_BASE_PATH: /
    steps:
      - name: Forráskód
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Java a Firestore emulátorhoz
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Függőségek
        run: npm ci
      - name: Firestore jogosultságok
        run: npm run test:rules
      - name: GitHub Pages elérési utak
        run: node --test tests/pwa-config.test.mjs
      - name: Naplózás, tervek és írástakarékosság
        run: npm run test:unit
      - name: Teszt build
        run: npm run build
      - name: PWA build ellenőrzése
        run: node scripts/check-pwa-build.mjs
      - name: Böngésző telepítése a tesztekhez
        run: npx playwright install chromium webkit --with-deps
      - name: Reszponzív felület és hozzáférésvédelem
        run: npm run test:e2e

  deploy:
    name: Publikálás GitHub Pages-re
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # These are Firebase's PUBLIC web configuration values, never account passwords
      # or an Admin SDK private key. User UIDs stay in the private access document.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
      VITE_USE_EMULATORS: 'false'
    steps:
      - name: Forráskód
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Függőségek
        run: npm ci
      - name: Firebase konfiguráció ellenőrzése
        run: node scripts/check-deploy-env.mjs
      - name: Naplózás és írástakarékosság ellenőrzése
        run: npm run test:unit
      - name: Éles build
        run: npm run build
      - name: PWA build és repository útvonal ellenőrzése
        run: node scripts/check-pwa-build.mjs
      - name: GitHub Pages beállítása
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Statikus alkalmazás feltöltése
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: GitHub Pages publikálás
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
